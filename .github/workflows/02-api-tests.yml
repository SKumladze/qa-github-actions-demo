# Runs the Postman collection with Newman (Postman's command line runner).
# If any test fails, the run turns red. The HTML report is saved either way.

name: 02 API Tests (Postman)

on:
  push:                  # every time someone pushes code
    branches: [main]
  pull_request:          # every time a pull request is opened or updated
  workflow_dispatch:     # manual "Run workflow" button
  schedule:
    - cron: "0 6 * * *"  # every day at 06:00 UTC, like a nightly regression run

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman and the HTML report plugin
        run: npm install

      - name: Run the Postman collection
        run: npm run test:api

      - name: Save the HTML report
        if: always()     # run this step even when the tests above failed
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/api-report.html
